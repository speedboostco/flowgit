name: Release
# Publishes when package.json carries a version that is not on npm yet.
on:
  push:
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish to npm
        id: publish
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if npm view "@speedboostco/flowgit@$v" version >/dev/null 2>&1; then
            echo "Version $v already published, skipping."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            npm publish --access public --provenance
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Tag and GitHub release
        if: steps.publish.outputs.published == 'true'
        run: gh release create "v${{ steps.publish.outputs.version }}" --target "$GITHUB_SHA" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
